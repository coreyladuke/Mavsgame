function assert(c,reason){if(!c)throw new Error(reason)}
async function hexSha256(str){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{
 try{
  const s=document.getElementById('status');
  const response=await fetch(BASE,{cache:'no-store'});
  assert(response.ok,'Original V21 could not be fetched: HTTP '+response.status);
  const source=await response.text();
  s.textContent='Checking the Aqua model and controls…';
  assert(await hexSha256(source)===SHA_BASE,'The published V21 source changed; refusing an unsafe patch.');
  let lines=source.split('\n');
  s.textContent='Installing better Aqua actions…';
  for(let i=PATCHES.length-1;i>=0;i--){
   const [a,b,oldLines,newLines]=PATCHES[i];
   assert(JSON.stringify(lines.slice(a,b))===JSON.stringify(oldLines),'Source mismatch at patch '+i);
   lines.splice(a,b-a,...newLines);
  }
  let complete=lines.join('\n');
  assert(await hexSha256(complete)===SHA_EXPECTED,'The assembled game did not match tested W-002B.');
  s.textContent='Starting Aqua…';
  document.open();document.write(complete);document.close();
 }catch(e){
  document.getElementById('status').textContent='Unable to load the test version';
  document.getElementById('error').hidden=false;
  document.getElementById('details').textContent=String(e?.message||e);
  console.error('Shark Quest W-002B loader',e);
 }
})();
