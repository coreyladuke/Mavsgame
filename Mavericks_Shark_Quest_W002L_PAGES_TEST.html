abled. */\n#qaHud{display:none;position:fixed;right:9px;top:calc(168px + env(safe-area-inset-top,0px));z-index:6;max-width:180px;padding:8px 10px;border-radius:11px;background:#092943d9;border:1px solid #9ae5f7b5;box-shadow:0 4px 12px #01233b77;color:#e9fff8;font:700 11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-line;pointer-events:none;text-shadow:0 1px 3px #000}\n#qaHud.active{display:block}\n#qaToggle,#qaExport{font-size:12px!important;padding:9px 10px!important;margin:5px 2px!important;width:calc(50% - 8px)!important;background:#c8eeed!important}\n#qaText{display:none;width:100%;height:120px;resize:vertical;border-radius:12px;background:#061c2d;color:#d5ffe9;font:11px/1.3 ui-monospace,Menlo,monospace;margin:8px 0;padding:12px;user-select:text;-webkit-user-select:text;white-space:pre-wrap}\n#qaNote{font-size:11px;color:#d9fcf4;line-height:1.35;margin-top:9px}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ccanvas id=\"world\" aria-label=\"Three-dimensional walkable Shark Quest character playground\"\u003e\u003c/canvas\u003e\n\u003cdiv id=\"qaHud\" aria-live=\"off\" aria-hidden=\"true\"\u003e\u003c/div\u003e\u003cdiv id=\"hud\"\u003e\u003cdiv id=\"crabHud\" role=\"status\" aria-live=\"polite\"\u003e\u2665\u2665\u2665 \u00b7 \ud83e\udd80 Find the crab and CHOMP twice!\u003c/div\u003e\u003cdiv id=\"top\"\u003e\u003cdiv\u003e\u003cdiv class=\"eyebrow\"\u003eMAVERICK'S SHARK QUEST \u00b7 16-BONE AQUA TEST\u003c/div\u003e\u003ch1\u003eAQUA \u00b7 W-002L \u00b7 FIELD TEST\u003c/h1\u003e\u003cdiv id=\"state\"\u003ePreparing Aqua and the island\u2026\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"topright\"\u003e\u003cbutton class=\"topbtn\" id=\"mapBtn\"\u003e\ud83d\uddfa MAP\u003c/button\u003e\u003cbutton class=\"topbtn\" id=\"menuBtn\"\u003e\u2630\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"compass-wrap\" class=\"inmenu\"\u003e\u003cdiv id=\"compass\"\u003e\u003c/div\u003e\u003cdiv id=\"objective\"\u003eSHARK OUTPOST\u003c/div\u003e\u003cbutton id=\"objectiveNext\"\u003eCHANGE GOAL \u21bb\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"hint\" class=\"inmenu\"\u003e\ud83e\udd80 CHOMP near the crab \u2022 Jump to dodge glowing attacks \u2022 Move + attack together\u003c/div\u003e\u003cdiv id=\"bottom\" class=\"inmenu\"\u003e\u003cdiv id=\"joy\"\u003e\u003cdiv id=\"nub\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"rightActions\"\u003e\u003cbutton class=\"small\" id=\"sprint\"\u003eRUN\u003c/button\u003e\u003cbutton class=\"small\" id=\"slide\"\u003eSLIDE\u003c/button\u003e\u003cbutton class=\"small\" id=\"chomp\"\u003eCHOMP\u003c/button\u003e\u003cbutton class=\"small\" id=\"belly\"\u003eFLOP\u003c/button\u003e\u003cbutton id=\"jump\"\u003eJUMP\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv id=\"mapOverlay\" class=\"hide\"\u003e\u003cdiv class=\"mapBox\"\u003e\u003ch2\u003eEXPLORE THE ISLAND\u003c/h2\u003e\u003ccanvas id=\"mapCanvas\" width=\"460\" height=\"320\"\u003e\u003c/canvas\u003e\u003cp\u003eBlue dot = Aqua \u2022 Gold dot = selected objective\u003c/p\u003e\u003cbutton id=\"mapClose\"\u003eBACK TO GAME\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"screen\"\u003e\u003cdiv id=\"card\"\u003e\u003cdiv class=\"eyebrow\"\u003eAQUA ONLY \u00b7 ACTUAL 3D \u00b7 TOON / INK\u003c/div\u003e\u003ch2\u003e\ud83e\udd88 AQUA: FIRST ADVENTURE \u00b7 W-002L\u003c/h2\u003e\u003cp\u003eExplore the island using your real shark with articulated walk/run legs and arms, a moving head and tail, and his original textures. Drag to orbit. Jump, slide, chomp, and belly-flop.\u003c/p\u003e\u003cp\u003e\u003cb\u003e3D movement. Comic ink outlines. Toon lighting.\u003c/b\u003e Painted island, moving wind and surf, PLUS our first cartoon crab. It patrols, spots Aqua, warns with a glowing ring and raised claws, then lunges. Dodge or jump! CHOMP twice to win a shell. No gore. All previous controls remain intact.\u003c/p\u003e\u003cbutton id=\"start\" disabled\u003eLOADING AQUA\u2026\u003c/button\u003e\u003cdiv style=\"display:flex;justify-content:space-between;gap:4px;margin-top:7px\"\u003e\u003cbutton id=\"qaToggle\" type=\"button\" aria-pressed=\"false\"\u003eQA HUD: OFF\u003c/button\u003e\u003cbutton id=\"qaExport\" type=\"button\"\u003eVIEW TEST REPORT\u003c/button\u003e\u003c/div\u003e\u003ctextarea id=\"qaText\" aria-label=\"Copyable local field-test report\" readonly\u003e\u003c/textarea\u003e\u003cdiv id=\"qaNote\"\u003eFor parent testing only. QA HUD is OFF by default. No data is uploaded or collected.\u003c/div\u003e\u003cdiv id=\"previewNotice\" style=\"font-size:12px;line-height:1.35;margin:3px 0 7px;color:#efffff\"\u003eIf this stays on Loading Aqua, this file viewer does not run games. The HTML must be hosted as a webpage to play.\u003c/div\u003e\u003csmall\u003eMove with the round joystick or WASD. Drag anywhere else to rotate the camera. This requires Safari on a HOSTED WEBPAGE. A ChatGPT or iPhone Files preview can block 3D and touch controls.\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"error\" role=\"alert\"\u003e\u003c/div\u003e\n\u003cscript\u003e\n/* Offline GLB, no fetch or library dependency. */\nconst AQUA_MODEL_B64=\"";
